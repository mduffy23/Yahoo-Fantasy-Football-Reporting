name: Update data and deploy site

on:
  schedule:
    - cron: "0 12 * * 2,3"   # Tuesday and Wednesday, 12:00 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      #- name: Ingest from Yahoo into Supabase
      #  run: python ingest.py
      #  env:
      #    DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #    YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      #    YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}

      - name: Build site
        run: python build_weekly_report.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
